name: Production API integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run smoke:production
